[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-video-tutorial"
version = "0.1.0"
description = "MCP server for video-to-tutorial workflow with transcription, scene detection, and code extraction"
authors = [{name = "Claude Code"}]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    "openai-whisper>=20231117",
    "yt-dlp>=2024.0.0",
    "ffmpeg-python>=0.2.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
enhanced = [
    "whisper-timestamped>=1.14.0",
    "rapidocr-onnxruntime>=1.1.0",
    "opencv-python>=4.9.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
all = [
    "mcp-video-tutorial[enhanced,dev]",
]

[project.scripts]
video-tutorial-server = "mcp_video_tutorial.server:run_server"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_video_tutorial*"]
